  #   model: gemini-3-flash-preview
  #   base_url: https://generativelanguage.googleapis.com/v1beta/openai/
  #   api_key_env: GOOGLE_API_KEY
  #   reasoning_effort: none

  # - name: gemini-3-pro
  #   backend: openai
  #   model: gemini-3.1-pro-preview
  #   base_url: https://generativelanguage.googleapis.com/v1beta/openai/
  #   api_key_env: GOOGLE_API_KEY
  #   reasoning_effort: medium
  #   max_tokens: 32768

# ---------------------------------------------------------------------------
# Pipeline defaults (read by build_kg.py — overridable on the CLI)
# ---------------------------------------------------------------------------
pipeline:
  text_model: deepseek-v4-flash
  vision_model: gpt-5.4
  verifier_model: gpt-4o-mini
  figure_prompt: ./final_prompts/figure_prompt.md
  text_prompt:   ./final_prompts/text_prompt.md

# ---------------------------------------------------------------------------
# Graph-RAG components (read by graph_rag/ FastAPI service)
# ---------------------------------------------------------------------------
#
# Each entry below is a *component* the Graph-RAG service uses. Swap the
# `model:` field to change which LLM/embedding model that component talks
# to. Models must either appear in the `models:` catalogue above, or — for
# the embedder — be a recognised embedding model name.
#
# Components:
#   * embedder           — embedding model for node label+description
#                          vectors (used by the Neo4j vector index).
#   * recommender_reranker — small/fast LLM that scores candidate
#                          node/edge suggestions, returning calibrated
#                          alpha-confidence.
#   * chat_agent         — tool-using LLM for the Modify-tab chat
#                          (add_node / remove_node / add_edge /
#                          remove_edge / query_effect).
#   * causal_narrator    — LLM that writes the plain-English explanation
#                          for "what if X increases?" questions, given a
#                          deterministically-computed signed-path summary.

components:
  embedder:
    provider: openai
    model: text-embedding-3-small
    api_key_env: OPENAI_API_KEY
    dimensions: 512
    # base_url:                 # uncomment to point at an OpenAI-compat embedding server

  recommender_reranker:
    model: claude-haiku-4.5    # references `models:` catalogue above
    temperature: 0.0

  chat_agent:
    model: deepseek-v4-pro
    temperature: 0.0

  causal_narrator:
    model: deepseek-v4-pro
    temperature: 0.0

  # Small/fast LLM that writes the one-line name + 1-2 sentence description
  # for feedback loops the frontend detects on the fly. Kept on a flash model
  # because it's called once per newly-formed loop and wants low latency.
  loop_describer:
    model: deepseek-v4-pro
    temperature: 0.2

  # Background recommender that inspects ONLY the current diagram (never the
  # KG) and proposes one high-confidence feedback loop the user could complete.
  # Flash model: it runs unprompted in the background, so latency + cost matter.
  # Slightly higher temperature to let it spot non-obvious but plausible loops;
  # the deterministic cycle-validation step downstream keeps it honest.
  loop_recommender:
    model: deepseek-v4-flash
    temperature: 0.3

# Graph-RAG runtime settings
graph_rag:
  neo4j_uri: neo4j+s://f52f4095.databases.neo4j.io
  neo4j_user: f52f4095
  neo4j_password: 6QQ78J-GtdLE6ho63sUlSCkuUALfijD7Vm4ksyLv4ys         
  neo4j_database: f52f4095
  vector_index_name: nodeLabelEmbedding
  merged_kg_path: ./merged_kg.json
  # ── Retrieval knobs ──────────────────────────────────────────────────
  # Tuned for a balance of accuracy and latency. The two levers most worth
  # tuning per-deployment are `max_hops` (accuracy↑ / latency↑) and
  # `top_k_vector` (recall↑ / rerank cost↑).
  #
  top_k_vector: 20   # Vector-search recall pool. The reranker only ever sees
                     # these, so anything outside this set can never be
                     # suggested → size it for recall. 30 reliably contains the
                     # right neighbours for a CLD-sized graph; below ~20 recall
                     # drops, above ~40 you pay to rerank near-duplicates.
  top_k_final: 8     # Hard ceiling on suggestions returned to the UI after
                     # rerank — a precision/clutter knob. The UI asks for 3–8,
                     # so 8 covers it without overwhelming the canvas. (Was 5,
                     # which silently capped richer requests.) Truncation is
                     # cheap; it doesn't change how many candidates get reranked.
  max_hops: 1        # Graph-neighbour expansion radius around each matched
                     # node. 1 = direct neighbours only (fast, but misses
                     # indirect causal links); 2 captures neighbours-of-
                     # neighbours, which materially improves suggestion quality
                     # on causal diagrams. 2 is the accuracy/latency sweet spot
                     # — drop to 1 only if strictly latency-bound; avoid 3+
                     # (candidate set explodes on dense KGs).
  damping: 0.6       # Per-hop decay on causal-path strength: a k-hop path is
                     # weighted damping^k, so a 2-hop link counts 0.36× a direct
                     # one. 0.6 keeps 2–3 hop paths influential without letting
                     # long, weak chains dominate. <0.5 is near-sightedly local;
                     # >0.7 lets distant noise leak in.
  #
  # ── Rerank skip heuristics (latency safety nets) ─────────────────────
  # Each skips the slow LLM rerank when its outcome is near-certain, trading a
  # negligible accuracy risk for a large latency win on easy queries.
  #
  skip_rerank_if_top_score_above: 0.90   # If the deterministic top candidate is
                     # already this confident, the LLM almost never reorders it
                     # — serve directly. 0.90 only short-circuits genuinely
                     # unambiguous hits. (Was 0.7, which skipped rerank on many
                     # medium-confidence queries and hurt accuracy.)
  skip_rerank_if_margin_above: 0.15      # If the gap between the top two
                     # candidates exceeds this, their order is unlikely to flip
                     # under rerank, so skip it. 0.15 catches the common
                     # "obvious winner" case while still reranking close calls.

  # ── Caching ────────────────────────────────────────────────────────────
  # All caches are optional. Redis is used opportunistically: if REDIS_URL
  # is empty OR Redis is unreachable, the service silently falls back to
  # in-process LRU caches. This makes the same image deployable to a
  # one-container free tier as well as a horizontally-scaled cluster.
  cache:
    redis_url: "rediss://default:gQAAAAAAAfqyAAIgcDE5OTExODI4NDMyYzg0YjQzOGMzY2U4Y2ZkNzNmYWU1ZQ@organic-muskrat-129714.upstash.io:6379"
    embedding_ttl_sec:    86400  # query-text → embedding (1 day)
    response_ttl_sec:       300  # canonical (query, canvas) → response
    semantic_threshold:    0.97  # cosine ≥ threshold → treat as cache hit
    semantic_max_entries:  1024
    lru_size:              2048

  # ── Streaming / progressive UX ─────────────────────────────────────────
  stream:
    # When true, /suggest/stream emits a fast "vector" event first and a
    # follow-up "rerank" event only if an LLM rerank actually runs.
    progressive: true
    # If the deterministic top-1 score is already this high, skip LLM
    # rerank entirely even on the streaming path.
    skip_llm_if_score_above: 0.7

# ---------------------------------------------------------------------------
# Eval-only sections (left intact for utils/eval.py and utils/diagram_eval.py)
# ---------------------------------------------------------------------------
prompts:
  - name: default
    system: ./final_prompts/text_prompt.md
    followup: null

diagram_prompts:
  - name: default
    variables: ./final_prompts/figure_prompt.md
    edges:     ./final_prompts/figure_prompt.md
