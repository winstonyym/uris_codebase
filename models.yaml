# models.yaml — model + prompt configuration for build_kg.py.
#
# `models:` is the catalogue of available LLMs. Each row is one runnable
# model. The `backend` is either:
#   * `openai`    — any OpenAI-compatible HTTP API (set base_url for
#                   non-OpenAI servers).
#   * `anthropic` — native Anthropic Messages API.
# Rows commented out are kept as ready-to-uncomment templates.
#
# `pipeline:` (optional) lets you set defaults for the build_kg.py CLI
# so you don't have to pass --text-model / --vision-model on every run.
#
# `prompts:` and `diagram_prompts:` are only consumed by the eval CLIs
# (utils/eval.py and utils/diagram_eval.py). The pipeline ignores them
# and uses `final_prompts/text_prompt.md` + `final_prompts/figure_prompt.md`
# unless overridden by `pipeline.figure_prompt` / `pipeline.text_prompt`.

models:
  - name: claude-haiku-4.5
    backend: anthropic
    model: claude-haiku-4-5-20251001
    api_key_env: ANTHROPIC_API_KEY
    max_tokens: 8192

  - name: claude-sonnet-4.6
    backend: anthropic
    model: claude-sonnet-4-6
    api_key_env: ANTHROPIC_API_KEY
    max_tokens: 8192

  - name: gpt-4o-mini
    backend: openai
    model: gpt-4o-mini
    api_key_env: OPENAI_API_KEY
    max_tokens: 8192

  - name: gpt-5.4
    backend: openai
    model: gpt-5.4
    api_key_env: OPENAI_API_KEY
    reasoning_effort: low
    max_tokens: 32768

  - name: gpt-4.1-nano
    backend: openai
    model: gpt-4.1-nano
    api_key_env: OPENAI_API_KEY
    reasoning_effort: none
    max_tokens: 32768

  - name: deepseek-v4-flash
    backend: openai
    model: deepseek-v4-flash
    base_url: https://api.deepseek.com
    api_key_env: DEEPSEEK_API_KEY
    max_tokens: 16384

  # - name: deepseek-v4-pro
